name: Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint component libraries
        run: python3 scripts/component_lint.py .

      - name: Run validator unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify strict fixture gate
        run: >-
          python3 scripts/validate_gzh_html.py
          --strict --fail-on-warning tests/fixtures/valid.html
